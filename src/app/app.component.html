
<nav id="navBar" class="navbar navbar-expand-lg navbar-light bg-success">
  <div class="container container-fluid">
    <span class="navbar-brand text-light fw-semibold d-flex align-items-center">
      <img src="favicon.png" alt="ForestDetector" class="navbar-logo me-2">
      <span *ngIf="!router.url.startsWith('/edit/')">ForestDetector</span>
    </span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <ng-container *ngFor="let button of (headerService.buttons$ | async)">
        <button class="btn btn-outline-dark" [style.visibility]="button.visible ? 'visible' : 'hidden'" [ngClass]="button.class"
          (click)="button.action(button)">
          <i *ngIf="button.icon" class="bi" [ngClass]="button.icon"></i>
          {{ button.label }}
        </button>
      </ng-container>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
